<!doctype html>
<meta charset="utf-8">
<title>Orbit interaction verification</title>
<style>
body{margin:20px;background:#17171b;color:#eee;font:14px system-ui,sans-serif}
button{padding:10px 16px;margin:0 7px 12px 0}main{display:flex;gap:24px;align-items:flex-start}
iframe{width:390px;height:844px;border:0;flex:none;zoom:.8}pre{white-space:pre-wrap;max-width:660px;min-width:330px}
p{max-width:780px;color:#bdb8c6}
</style>
<h1>Orbit interaction checks</h1>
<p>Tests use the local demonstration history and a temporary browser workout. Saved state is restored afterward. The year view leaves dates without measurements blank.</p>
<button id="run">Run interaction checks</button><button id="year">Preview Body year</button><button id="home">Preview scrolling edge</button><button id="active">Preview active live bar</button><button id="narrow">Use 320 px</button><button id="wide">Use 390 px</button><button id="reset">Reset preview</button>
<main><iframe id="live" title="Orbit interaction test phone" src="../index.html?ux-motion-check"></iframe><pre id="result">Ready.</pre></main>
<script>
const live=document.querySelector('#live'),result=document.querySelector('#result'),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

let previewRaw;

  if(api())return;
  const script=doc().createElement('script');script.textContent='window.__ux={Health,MusicPlayer,WorkoutFocus,setLiveOpen,setDeckExpanded,cyclePeriod,changeMetric,inspectBar,islands,updateLiveBar,get period(){return days}};';doc().head.append(script);

document.querySelector('#narrow').onclick=()=>live.style.width='320px';document.querySelector('#wide').onclick=()=>live.style.width='390px';
document.querySelector('#reset').onclick=()=>{if(previewRaw!==undefined){if(previewRaw===null)w().localStorage.removeItem(key);else w().localStorage.setItem(key,previewRaw);previewRaw=undefined}w().location.reload();result.textContent='Preview reset.'};

document.querySelector('#home').onclick=async()=>{preserve();api().Health.close();await wait(220);api().setDeckExpanded(true);await wait(850);q('#deck-scroll').scrollTop=135;result.textContent='Scrolling edge preview. Scroll cards beneath the globe; the leading edge fades into the continuous background.'};
document.querySelector('#active').onclick=async()=>{preserve();if(!api().Health.state.active)api().Health.action('start','Walking');api().Health.close();await wait(220);api().setLiveOpen(true);result.textContent='Active live bar preview. One growing surface contains its controls. Tap the bottom row to open or close it.'};

  const raw=w().localStorage.getItem(key),button=document.querySelector('#run'),checks=[],measurements={};button.disabled=true;

    check(!JSON.parse(raw||'{"active":null}').active,'Use an isolated origin with no active workout');expose();result.textContent='Checking…';

    api().setLiveOpen(true);check(Math.abs(box(shell).height-closing)<.3,'Reopening must continue from the displayed shell');await wait(900);

    ptr(labels[0],'pointerdown',cx(labels[0]),ty);for(let i=1;i<=12;i++){await nextFrame();ptr(labels[0],'pointermove',cx(labels[0])+(cx(labels[2])-cx(labels[0]))*i/12,ty)}await wait(150);

    q('#body-scrub').value=0;q('#body-scrub').dispatchEvent(new (w().Event)('input',{bubbles:true}));check(q('#body-date').textContent.includes('Jun'),'Scrubbing missing history must select an existing date');check(Number(q('#body-scrub').value)>270,'Scrubber must align with the recorded date, not invent earlier readings');

        await slide(ax,ay,bx,by);
        check(chosen()==='open'&&track.classList.contains('is-dragging')&&box(capsule).left>box(segs[0]).left+2,'A held drag must carry the capsule without committing early: '+box(capsule).left);
        check(style(segs[1]).color!==style(segs[0]).color||segs[1].classList.contains('is-over'),'The option under the finger must be marked');
        for(let i=8;i>=0;i--){await nextFrame();ptr(track,'pointermove',ax+(bx-ax)*i/8,ay)}
        ptr(track,'pointerup',ax,ay);await wait(340);
        check(chosen()==='open'&&q('#target-options').hidden&&q('#target-minutes').disabled&&Math.abs(box(capsule).left-box(segs[0]).left)<1.5,'Reversing and releasing over Open must keep Open, with the duration hidden and excluded');
        await slide(ax,ay,bx,by);ptr(track,'pointerup',bx,by);await wait(340);
        check(chosen()==='time'&&!q('#target-options').hidden&&!q('#target-minutes').disabled&&Math.abs(box(capsule).left-box(segs[1]).left)<1.5,'Releasing over Time target must commit it, reveal the duration and settle the capsule');
        await slide(bx,by,ax,ay,6);ptr(track,'pointercancel',ax,ay);await wait(340);
        check(chosen()==='time'&&Math.abs(box(capsule).left-box(segs[1]).left)<1.5,'A cancelled gesture must restore the previous selection');
        await slide(bx,by,ax,ay,6);ptr(track,'pointerup',ax,box(track).bottom+120);await wait(340);
        check(chosen()==='time'&&Math.abs(box(capsule).left-box(segs[1]).left)<1.5,'Releasing away from the track must restore the previous selection');
        ptr(track,'pointerdown',bx,by);for(let i=1;i<=6;i++){await nextFrame();ptr(track,'pointermove',bx,by+i*7)}ptr(track,'pointerup',bx,by+42);await wait(240);
        check(!track.classList.contains('is-dragging')&&style(track).touchAction.includes('pan-y')&&chosen()==='time','A vertical gesture must remain a scroll and change nothing');
        q('input[name="target"][value="open"]').click();await wait(320);
        check(chosen()==='open'&&q('#target-options').hidden,'Activating the radio directly, as a keyboard or assistive technology does, must still select Open');
        pickTarget('time');await wait(320);
        check(!q('#target-options').hidden&&!q('#target-minutes').disabled&&q('#target-minutes').value==='30','Time target must reveal a 30-minute duration');
        check(Math.abs(box(q('.setup-capsule')).left-box(q('input[name="target"][value="time"]').closest('label')).left)<1,'The capsule must move under Time target');
        q('#target-minutes').value='45';pickTarget('open');await wait(320);check(q('#target-options').hidden&&q('#target-minutes').disabled,'Open workout must hide and disable the duration');
        pickTarget('time');await wait(320);check(q('#target-minutes').value==='45','Switching back must keep the entered duration');
        q('#workout-weight').value='10';q('.workout-primary').click();check(q('#workout-weight').validity.rangeUnderflow&&!q('.workout-countdown'),'A weight below 20 kg must be rejected');
        q('#workout-weight').value='';q('.workout-primary').click();await wait(200);check(q('.workout-countdown')&&q('#workout-count').textContent==='3','A blank weight must be allowed and start the countdown');
        q('[data-cancel-countdown]').click();await wait(400);check(q('#health-page').dataset.workoutScreen==='setup'&&q('#target-minutes').value==='45'&&!api().Health.state.active,'Cancelling the countdown must return to setup with the target kept');
      }
      api().Health.close();await wait(400);
    }
    checks.push('Shared chooser rows; one-title setup for every activity; open/time with kept duration; GPS only outdoors; weight validation; countdown cancel');
    checks.push('Target segments answer tap, hold, drag, reversal, cancellation, release outside the track and vertical scrolling, with no default tap highlight');
    // The page reserves whatever room the host reports for the system bars, rather than an assumed bar height.
    api().Health.open('workouts');await wait(360);const headTop=box(q('.health-page-head .icon-button')).top;
    doc().documentElement.style.setProperty('--orbit-inset-top','48px');await nextFrame();const insetTop=box(q('.health-page-head .icon-button')).top;
    doc().documentElement.style.removeProperty('--orbit-inset-top');await nextFrame();
    check(insetTop-headTop>30&&Math.abs(box(q('.health-page-head .icon-button')).top-headTop)<1,'Reported system-bar room must move the header and back control down: '+(insetTop-headTop));
    checks.push('Reported system-bar room moves the header clear of transient bars (browser only; device insets are not verifiable here)');
    api().Health.close();await wait(230);check(doc().documentElement.scrollWidth<=doc().documentElement.clientWidth+1,'No horizontal page overflow');
    result.textContent=JSON.stringify({status:'PASS',width:doc().documentElement.clientWidth,checks,measurements},null,2);
  }catch(error){result.textContent=error.stack}
  finally{try{if(raw===null)w().localStorage.removeItem(key);else w().localStorage.setItem(key,raw);w().location.reload()}finally{button.disabled=false}}
};
</script>
