<!doctype html><meta charset="utf-8"><title>Orbit motion verification</title>
<style>body{margin:24px;background:#17171b;color:#eee;font:14px system-ui}button{padding:10px 18px;margin:0 8px 14px 0}#live{width:390px;height:844px;border:0}main{display:flex;gap:24px}pre{white-space:pre-wrap;max-width:600px}</style>
<button id="run">Check motion and popups</button><button id="narrow">Use 320 px</button><button id="wide">Use 390 px</button>
<main><iframe id="live" src="../index.html?motion-review"></iframe><pre id="result">Ready</pre></main>
<script>
const live=document.querySelector('#live'),result=document.querySelector('#result');
document.querySelector('#narrow').onclick=()=>live.style.width='320px';
document.querySelector('#wide').onclick=()=>live.style.width='390px';
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
document.querySelector('#run').onclick=async()=>{
 const w=live.contentWindow,d=w.document,bar=d.querySelector('#live-bar'),canvas=d.querySelector('#orb-canvas'),frames=[];
 const q=s=>d.querySelector(s),rect=s=>{const r=q(s).getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:r.height,left:r.left,right:r.right}};
 const check=(value,message)=>{if(!value)throw Error(message)};
 let recording=false;
 try{
  result.textContent='Checking...';
  if(bar.getAttribute('aria-expanded')==='true'){bar.click();await wait(550)}
  q('#period-1').click();
  const initial=rect('#orb-canvas');
  check(d.elementFromPoint(w.innerWidth/2,initial.bottom-20)?.closest('#orb-button'),'Folded deck must not intercept the lower orb');
  recording=true;
  const sample=t=>{frames.push({t,orb:rect('#orb-canvas'),hero:rect('.hero'),card:rect('.facts'),period:rect('.periods')});if(recording)w.requestAnimationFrame(sample)};
  w.requestAnimationFrame(sample);bar.click();await wait(600);
  check(rect('#orb-canvas').top<initial.top,'Orb must move upward');
  check(q('.facts').getBoundingClientRect().bottom<q('.hourly').getBoundingClientRect().top,'Expanded cards must not overlap');
  bar.click();await wait(90);bar.click();await wait(90);bar.click();await wait(600);recording=false;
  check(Math.abs(rect('#orb-canvas').top-initial.top)<.1,'Reversal must return orb to start');
  check(frames.every(f=>Math.abs(f.hero.height-frames[0].hero.height)<.1),'Hero must not relayout during motion');
  check(frames.every(f=>Math.abs(f.card.height-frames[0].card.height)<.1),'Cards must not relayout during motion');
  check(canvas===q('#orb-canvas'),'Canvas must remain mounted');
  check(frames.every(f=>f.period.top-f.orb.bottom>=0),'Orb must not overlap period control');
  check(d.documentElement.scrollWidth<=live.clientWidth,'Horizontal overflow');
  bar.click();await wait(550);q('#deck-scroll').scrollTop=10000;await wait(50);
  check(q('.comparison').getBoundingClientRect().bottom<=q('#deck-scroll').getBoundingClientRect().bottom+1,'Last card must be reachable');
  bar.click();await wait(550);check(q('#deck-scroll').scrollTop===0,'Collapse must reset scroll');
  const popups=[];
  const verifyPopup=selector=>{const r=rect(selector);check(r.height<=w.innerHeight*.65+1&&r.left>=0&&r.right<=w.innerWidth,'Popup exceeds compact viewport bounds');popups.push({selector,...r})};
  q('#more').click();await wait(350);verifyPopup('#options');
  q('#edit-goal').click();await wait(350);verifyPopup('#goal-dialog');
  q('#goal-dialog .cancel').click();await wait(350);check(!q('dialog[open]'),'Goal cancel must close');
  q('#more').click();await wait(350);q('#open-about').click();await wait(350);verifyPopup('#about');
  q('#about .close').click();await wait(350);
  q('#date-button').click();await wait(350);verifyPopup('#date-dialog');
  q('#date-prev').click();q('#date-form').requestSubmit();await wait(350);
  check(!q('dialog[open]')&&q('#date-button').textContent.includes('7'),'Date selection must apply and close');
  q('#back').click();
  q('#more').click();await wait(70);q('#options .close').click();await wait(350);
  check(!q('dialog[open]'),'Close during opening must finish');
  check(d.activeElement===q('#more'),'Focus must return to trigger');
  check(w.getComputedStyle(q('#more')).opacity==='1','Trigger must become visible again');
  const gaps=frames.slice(1).map((f,i)=>f.t-frames[i].t);
  result.textContent=JSON.stringify({status:'PASS',width:live.clientWidth,frames:frames.length,maxFrameGapMs:Math.max(...gaps),minimumOrbToPeriodGap:Math.min(...frames.map(f=>f.period.top-f.orb.bottom)),sameCanvas:true,fixedHeroAndCardLayout:true,scrollToLastCard:true,midOpeningClose:true,focusRestored:true,popups},null,2);
 }catch(error){recording=false;result.textContent='FAIL: '+error.message;throw error}
};
</script>
